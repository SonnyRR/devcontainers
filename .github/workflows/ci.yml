name: Build & Publish Devcontainer Images

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: Select image flavor
        required: true
        default: all
        type: choice
        options:
          - all
          - opensuse-tumbleweed
          - opensuse-leap
          - ubuntu-lts

permissions:
  contents: read

# Single source of truth for the Trivy scanner version used by every scan
# step (SARIF scan, Copa report scan, verify gate).
# Note: must include the leading "v" — it is passed verbatim to Trivy's
# contrib/install.sh via setup-trivy, which loads
# github.com/aquasecurity/trivy/releases/<version> and fails with
# "unable to find '...'" when the tag does not exist verbatim.
env:
  TRIVY_VERSION: v0.76.2

concurrency:
  group: ${{ github.workflow }} @ ${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare build matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate flavor definitions
        shell: bash
        run: |
          set -euo pipefail

          # flavors.json is data that flows into shell, git refs, the registry and
          # an external action. Reject anything outside a strict allowlist here so a
          # crafted or malformed entry can never inject commands downstream. Bash
          # regex (=~) matches the whole string and never spans newlines, so embedded
          # newlines / metacharacters are rejected rather than smuggled through.
          if ! jq empty .github/flavors.json 2>/dev/null; then
            echo "::error::.github/flavors.json is not valid JSON" >&2
            exit 1
          fi

          errors=0
          count="$(jq 'length' .github/flavors.json)"
          for i in $(seq 0 "$((count - 1))"); do
            flavor="$(jq -r ".[$i].flavor // empty" .github/flavors.json)"
            image_name="$(jq -r ".[$i].image_name // empty" .github/flavors.json)"
            dockerfile_path="$(jq -r ".[$i].dockerfile_path // empty" .github/flavors.json)"
            context="$(jq -r ".[$i].context // empty" .github/flavors.json)"
            versioning="$(jq -r ".[$i].versioning // empty" .github/flavors.json)"
            base_version="$(jq -r ".[$i].base_version // empty" .github/flavors.json)"

            check() { # field value regex
              local re="$3"
              if [[ ! "$2" =~ $re ]]; then
                echo "::error::flavors[$i].$1 value '$2' does not match /$re/" >&2
                errors=1
              fi
            }

            check flavor          "$flavor"          '^[a-z0-9]([a-z0-9-]*[a-z0-9])?$'
            check image_name      "$image_name"      '^[a-z0-9]([a-z0-9._/-]*[a-z0-9])?$'
            check dockerfile_path "$dockerfile_path" '^\./[A-Za-z0-9._/-]+$'
            check context         "$context"         '^(\.|\./[A-Za-z0-9._/-]+)$'
            check versioning      "$versioning"      '^(calver|release)$'

            # base_version: required (numeric) for release, must be absent for calver.
            if [[ "$versioning" == "release" ]]; then
              check base_version "$base_version" '^[0-9]+(\.[0-9]+)*$'
            elif [[ -n "$base_version" ]]; then
              echo "::error::flavors[$i].base_version must be empty when versioning=calver" >&2
              errors=1
            fi

            # No path traversal in path-like fields (the charclasses above permit dots).
            case "${dockerfile_path}|${context}" in
              *..*) echo "::error::flavors[$i]: '..' is not allowed in dockerfile_path/context" >&2; errors=1 ;;
            esac
          done

          if [[ "$errors" -ne 0 ]]; then
            echo "Flavor validation failed; refusing to build." >&2
            exit 1
          fi
          echo "All flavor definitions are valid."

      - name: Resolve flavors to build
        id: set-matrix
        shell: bash
        env:
          FLAVOR_INPUT: ${{ inputs.flavor }}
        run: |
          set -euo pipefail

          if [[ "$FLAVOR_INPUT" == "all" ]]; then
            flavors="$(jq -c '[.[] | {flavor: .flavor}]' .github/flavors.json)"
          else
            flavors="$(jq -c --arg f "$FLAVOR_INPUT" '[.[] | select(.flavor == $f) | {flavor: .flavor}]' .github/flavors.json)"
          fi

          echo "matrix=$(echo "$flavors" | jq -c '{include: .}')" >> "$GITHUB_OUTPUT"

  publish-devbox-image:
    name: Build & publish DevBox image
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
      # Required to publish Trivy SARIF results to the code scanning Security tab.
      security-events: write
    strategy:
      # Build each flavor independently — one flavor's failure must NOT cancel the
      # others. A factory publishes independent images; without this, e.g. an
      # opensuse-leap failure aborts the remaining flavor builds mid-run.
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve flavor metadata
        id: meta
        shell: bash
        env:
          FLAVOR: ${{ matrix.flavor }}
        run: |
          set -euo pipefail
          image_name="$(jq -r --arg f "$FLAVOR" '.[] | select(.flavor == $f) | .image_name' .github/flavors.json)"
          dockerfile_path="$(jq -r --arg f "$FLAVOR" '.[] | select(.flavor == $f) | .dockerfile_path' .github/flavors.json)"
          context="$(jq -r --arg f "$FLAVOR" '.[] | select(.flavor == $f) | .context' .github/flavors.json)"
          versioning="$(jq -r --arg f "$FLAVOR" '.[] | select(.flavor == $f) | .versioning' .github/flavors.json)"
          base_version="$(jq -r --arg f "$FLAVOR" '.[] | select(.flavor == $f) | .base_version // ""' .github/flavors.json)"
          {
            echo "image_name=${image_name}"
            echo "dockerfile_path=${dockerfile_path}"
            echo "context=${context}"
            echo "versioning=${versioning}"
            echo "base_version=${base_version}"
          } >> "$GITHUB_OUTPUT"

      - name: Compute version and image tags
        id: version
        shell: bash
        env:
          FLAVOR: ${{ matrix.flavor }}
          VERSIONING: ${{ steps.meta.outputs.versioning }}
          BASE_VERSION: ${{ steps.meta.outputs.base_version }}
          IMAGE_NAME: ${{ steps.meta.outputs.image_name }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail

          case "$VERSIONING" in
            calver)
              # Rolling base (e.g. Tumbleweed): dated, immutable snapshots.
              day="$(date -u +%Y.%m.%d)"
              latest_for_day="$({ git tag -l "${FLAVOR}/v${day}.*" || true; } | sed -E 's|.*/v[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.([0-9]+)$|\1|' | sort -n | tail -n1)"
              if [[ -z "$latest_for_day" ]]; then
                counter=1
              else
                counter=$((latest_for_day + 1))
              fi
              version="${day}.${counter}"
              release_tags="${version},latest"
              ;;
            release)
              # Versioned base (e.g. Leap/Ubuntu): fixed tag, overwritten each build.
              version="${BASE_VERSION}"
              release_tags="${BASE_VERSION},latest"
              ;;
            *)
              echo "Unknown versioning strategy: '${VERSIONING}'" >&2
              exit 1
              ;;
          esac

          git_tag="${FLAVOR}/v${version}"
          short_sha="$(git rev-parse --short HEAD)"
          raw_branch="${GITHUB_REF_NAME}"
          safe_branch="$(printf '%s' "$raw_branch" | tr '[:upper:]' '[:lower:]' | sed -E 's#[^a-z0-9_.-]+#-#g; s#^[.-]+##; s#-+#-#g; s#\.+#.#g; s#[.-]+$##')"
          if [[ -z "$safe_branch" ]]; then
            safe_branch="branch"
          fi

          # An immutable, commit-pinned tag published on every build so an image
          # can be pinned to an exact commit regardless of branch/versioning.
          # The full 40-char commit SHA is used verbatim as the tag.
          sha_tag="${GITHUB_SHA}"

          if [[ "${GITHUB_REF}" == "refs/heads/main" || "${GITHUB_REF}" == "refs/heads/master" ]]; then
            promote_tag_names="${release_tags}"
          else
            promote_tag_names="beta-${version}-${short_sha},beta-${safe_branch}-${short_sha},beta-${safe_branch}-latest"
          fi

          # build-push-action's `tags` input is comma-separated and each element is
          # handed to buildx as a separate --tag. Every element must therefore be a
          # COMPLETE image reference: a bare "latest" is normalised by buildx into
          # docker.io/library/latest (the official namespace), which is not pushable
          # from this account. Emit fully-qualified refs for every tag.
          repo="docker.io/${DOCKERHUB_USERNAME}/${IMAGE_NAME}"
          promote_tags=""
          IFS=',' read -ra promote_tag_names_arr <<< "$promote_tag_names"
          for tag_name in "${promote_tag_names_arr[@]}"; do
            promote_tags+="${repo}:${tag_name},"
          done
          promote_tags="${promote_tags%,}"

          # Only the immutable, commit-pinned sha tag is published at build time.
          # The release/beta tags above are applied to the FINAL image (original or
          # Copa-patched) by the promotion step, after the Trivy scan + Copacetic
          # patch + verify gate passes. This keeps vulnerable images out of the
          # versioned/latest tags even when the image itself is already in the
          # registry under its sha tag.
          build_tags="${repo}:${sha_tag}"

          {
            echo "version=${version}"
            echo "git_tag=${git_tag}"
            echo "repo=${repo}"
            echo "build_tags=${build_tags}"
            echo "promote_tags=${promote_tags}"
            echo "safe_branch=${safe_branch}"
            echo "short_sha=${short_sha}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish OCI-compatible image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ steps.meta.outputs.context }}
          file: ${{ steps.meta.outputs.dockerfile_path }}
          push: true
          tags: ${{ steps.version.outputs.build_tags }}

      # ---------------------------------------------------------------------------
      # Vulnerability scanning & auto-remediation pipeline:
      #
      #   1. Trivy scans the just-pushed image (full vuln scan -> SARIF -> code
      #      scanning) and again with an OS-packages-only, fixable-only JSON
      #      report sized for Copacetic.
      #   2. If fixable OS-package vulnerabilities were found, copa patches the
      #      image in place (adds a lightweight patch layer via apt/zypper/dnf)
      #      and pushes it alongside the original, together with an OpenVEX
      #      record of what it remediated.
      #   3. A verify rescan acts as the release gate: the job fails if fixable
      #      HIGH/CRITICAL OS vulnerabilities remain after patching.
      #   4. Only after the gate passes are the promoted tags (version + latest
      #      on main, beta-* on branches) applied to the final image via
      #      `docker buildx imagetools create` (server-side, digest-based).
      #
      # Supply-chain note: trivy-action was compromised in March 2026
      # (GHSA-69fq-xp46-6x23); v0.35.0+ are the clean releases. The action is
      # therefore pinned to the immutable SHA of v0.36.0, never a mutable tag.
      # ---------------------------------------------------------------------------

      - name: Scan image with Trivy (full vuln scan, SARIF output)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.version.outputs.repo }}:${{ github.sha }}
          format: sarif
          output: trivy-full.sarif
          scanners: vuln
          # Pin the scanner version explicitly rather than riding the action's
          # per-release default; setup-trivy then caches the binary too.
          # TRIVY_VERSION (workflow-level env) is the single source of truth.
          version: ${{ env.TRIVY_VERSION }}

      - name: Upload SARIF results to GitHub Code Scanning
        # continue-on-error: code scanning upload requires GitHub Advanced
        # Security on private repos; a missing GHAS license must not block
        # releases. The actual release gate is the dedicated verify step below.
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-full.sarif
          # Distinct category per flavor keeps matrix uploads separate.
          category: trivy-devcontainer-${{ matrix.flavor }}

      - name: Scan image with Trivy (fixable OS packages, JSON for Copa)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.version.outputs.repo }}:${{ github.sha }}
          format: json
          output: trivy-os-pkgs-report.json
          # Copa can only patch OS packages (dpkg/rpm/zypper); language/library
          # findings require rebuilding the Dockerfile instead.
          vuln-type: os
          # Fixable-only: unfixed findings are upstream/base-image issues that
          # cannot be remediated here; gate policy excludes them.
          ignore-unfixed: true
          version: ${{ env.TRIVY_VERSION }}

      - name: Count fixable OS-package vulnerabilities
        id: vulns
        shell: bash
        env:
          REPORT: trivy-os-pkgs-report.json
        run: |
          set -euo pipefail
          count="$(jq '[.Results[]? | select(.Class == "os-pkgs" and .Vulnerabilities != null) | .Vulnerabilities[]] | length' "$REPORT")"
          echo "count=${count}" >> "$GITHUB_OUTPUT"
          if [[ "$count" -gt 0 ]]; then
            echo "::notice::Found ${count} fixable OS-package vulnerabilities; Copa patching will run."
          else
            echo "::notice::No fixable OS-package vulnerabilities found; skipping Copa patching."
          fi

      - name: Patch image OS packages with Copa
        # Only runs when the scan found patchable OS-package vulnerabilities.
        if: ${{ steps.vulns.outputs.count != '0' }}
        id: copa
        uses: project-copacetic/copa-action@3843e22efdca421adb37aa8dec103a0f1db68544 # v1.2.1
        with:
          image: ${{ steps.version.outputs.repo }}:${{ github.sha }}
          image-report: trivy-os-pkgs-report.json
          patched-tag: copa-${{ github.sha }}
          # Pin Copa explicitly; the action otherwise resolves "latest" from
          # the GitHub API at runtime, which is an unpinned supply chain.
          copa-version: 0.15.0
          # Free extra headroom beyond the 5m default: zypper/dpkg refreshes on
          # full distro images can be slow.
          timeout: 15m
          # OpenVEX record of remediated vulnerabilities (audit trail).
          output: vex-${{ matrix.flavor }}.json
          format: openvex

      - name: Upload OpenVEX remediation record
        if: ${{ steps.vulns.outputs.count != '0' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vex-${{ matrix.flavor }}
          path: vex-${{ matrix.flavor }}.json
          if-no-files-found: warn

      - name: Select final image (Copa-patched or original)
        id: final
        shell: bash
        env:
          REPO: ${{ steps.version.outputs.repo }}
          SHA_TAG: ${{ github.sha }}
          VULN_COUNT: ${{ steps.vulns.outputs.count }}
        run: |
          set -euo pipefail
          if [[ "$VULN_COUNT" == "0" ]]; then
            final_image="${REPO}:${SHA_TAG}"
          else
            # copa ran (and any failure would have already failed the job).
            final_image="${REPO}:copa-${SHA_TAG}"
          fi
          echo "final_image=${final_image}" >> "$GITHUB_OUTPUT"

      # Release gate: fail if fixable HIGH/CRITICAL OS vulnerabilities remain
      # after patching. Failed promotion means the release/beta tags are never
      # applied and the git release tag is never created.
      - name: Verify final image has no remaining HIGH/CRITICAL OS vulns
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.final.outputs.final_image }}
          format: table
          scanners: vuln
          vuln-type: os
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: '1'
          version: ${{ env.TRIVY_VERSION }}

      - name: Promote release/beta tags to final image
        shell: bash
        env:
          PROMOTE_TAGS: ${{ steps.version.outputs.promote_tags }}
          FINAL_IMAGE: ${{ steps.final.outputs.final_image }}
        run: |
          set -euo pipefail
          args=()
          IFS=',' read -ra tags <<< "$PROMOTE_TAGS"
          for tag in "${tags[@]}"; do
            args+=( -t "$tag" )
          done
          # Server-side manifest copy (no image download): points the promoted
          # tags at the exact manifest of the final image.
          docker buildx imagetools create "${args[@]}" "$FINAL_IMAGE"

      - name: Tag git commit with release version
        if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
        shell: bash
        env:
          GIT_TAG: ${{ steps.version.outputs.git_tag }}
          VERSIONING: ${{ steps.meta.outputs.versioning }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git rev-parse -q --verify "refs/tags/${GIT_TAG}" >/dev/null; then
            if [[ "$VERSIONING" == "calver" ]]; then
              # Dated snapshots are immutable; never move an existing calver tag.
              echo "Tag '${GIT_TAG}' already exists (calver is immutable). Skipping."
              exit 0
            fi
            # Fixed release versions (e.g. Leap/Ubuntu) track the latest build:
            # move the existing tag to the current commit.
            echo "Tag '${GIT_TAG}' already exists; moving it to ${GITHUB_SHA}."
          fi

          # -f creates the tag, or moves it if it already exists (release flavors).
          git tag -f -a "$GIT_TAG" -m "Release ${GIT_TAG}"
          git push -f origin "refs/tags/${GIT_TAG}:refs/tags/${GIT_TAG}"
